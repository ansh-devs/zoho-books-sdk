name: Release

# Every push to master publishes package.json's version, unless npm already has it.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # push the version tag and create the GitHub release
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest

      - name: Check whether this version is already on npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published, nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          # A version with a prerelease suffix such as beta.1 goes to the next tag, not latest.
          case "$version" in *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;; *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;; esac

      - if: steps.version.outputs.publish == 'true'
        run: npm ci

      - if: steps.version.outputs.publish == 'true'
        run: npm run check

      # The check already ran above, so skip prepublishOnly running it again.
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public --tag ${{ steps.version.outputs.tag }} --ignore-scripts
        env:
          # Used only until trusted publishing is configured on npmjs.com; npm prefers OIDC when it is.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - if: steps.version.outputs.publish == 'true'
        name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes $([[ "$VERSION" == *-* ]] && echo --prerelease)
