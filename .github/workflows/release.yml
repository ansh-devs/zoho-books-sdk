name: Release

# Every push to master releases if the new commits call for it: fix is a patch, feat a minor, a breaking change a major.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # push the version tag and create the GitHub release
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, so the version can be worked out from commits

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      # Fail before anything is tagged or published.
      - run: npm run check

      # Removes a tag whose version never reached npm and its leftover note, and starts at v0.0.0 when nothing is tagged.
      - name: Prepare release tags
        run: bash .github/scripts/prepare-release-tags.sh

      # Sets the version, publishes to npm (prepublishOnly rebuilds with that version), tags it and writes the GitHub release.
      # Preset 9 matches the changelog writer semantic-release 25 bundles; preset 10 needs a newer writer.
      - run: npx --yes -p semantic-release@25.0.9 -p conventional-changelog-conventionalcommits@9.3.1 semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Used only until trusted publishing is configured on npmjs.com.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
